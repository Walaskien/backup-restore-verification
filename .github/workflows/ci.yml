name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  promtool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check config, check rules, unit tests
        run: |
          docker run --rm \
            -v "$PWD/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/prometheus/rules:/etc/prometheus/rules:ro" \
            --entrypoint promtool prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v2.55.1 check rules /p/rules/backup.yml
          docker run --rm -v "$PWD/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v2.55.1 test rules /p/tests/backup_test.yml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: start the stack
        run: make up
      - name: backup, restore verification, rotation
        run: tests/e2e_happy_path.sh
      - name: corrupted backups must fail verification and raise the alert
        run: tests/e2e_corrupted_backup.sh
      - name: container logs on failure
        if: failure()
        run: docker compose -p brv logs --no-color --tail=100
      - name: tear down
        if: always()
        run: make down
