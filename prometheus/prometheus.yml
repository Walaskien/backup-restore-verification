global:
  # Short so the end-to-end test does not wait long for an alert. A real
  # setup would keep the default 1m.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
